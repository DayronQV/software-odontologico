# API Gateway / Ingress de SIGO-Dental (SRS §7): TLS 1.3, proxy a backend y frontend.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;

    # Solo se acepta el upgrade a WebSocket (evita el contrabando de conexiones h2c).
    map $http_upgrade $ws_upgrade {
        default   "";
        websocket websocket;
    }
    map $http_upgrade $connection_upgrade {
        default   close;
        websocket upgrade;
    }

    # Host admitido: solo nombres de host/IP válidos (evita inyección de cabecera Host en redirecciones).
    map $host $host_valid {
        default 0;
        "~^[A-Za-z0-9.-]{1,253}$" 1;
    }

    # HTTP: solo healthcheck y redirección a HTTPS
    server {
        listen 80;
        server_name _;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        location / {
            if ($host_valid = 0) { return 444; }
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: únicamente TLS 1.3 (RNF-04)
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 16m;  # adjuntos de hasta 15 MB + cabeceras multipart

        # API REST (+ Swagger en /api/docs)
        location /api/ {
            proxy_pass http://backend:3000;
            proxy_hide_header Strict-Transport-Security;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSockets seguros (WSS)
        location /ws/ {
            proxy_pass http://backend:3000;
            proxy_hide_header Strict-Transport-Security;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $ws_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # Aplicación web (React)
        location / {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' wss:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            proxy_pass http://frontend:8080;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
