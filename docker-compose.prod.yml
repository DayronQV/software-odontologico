name: sigo-dental-prod

# Producción AUTOALOJADA (servidor propio / VPS). Para Render use render.yaml.
#   cp .env.production.example .env.production   # y complete TODOS los valores (sin valores por defecto)
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Certificado TLS: coloque certs/server.crt y certs/server.key (ver documentacion/guia-despliegue.md).
# Orden de arranque garantizado con healthchecks: postgres/redis/minio -> backend -> frontend -> nginx.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sigo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Almacenamiento de documentos clínicos con cifrado SSE-S3 (mismo API que S3).
  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    logging: *logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?defina MINIO_KMS_SECRET_KEY}
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  minio-init:
    image: bitnamilegacy/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-sigo-files}
      BACKUP_BUCKET: ${BACKUP_S3_BUCKET:-sigo-backups}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        i=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          i=$$((i+1))
          [ "$$i" -ge 30 ] && echo "MinIO no responde" && exit 1
          sleep 2
        done
        for bucket in "$$MINIO_BUCKET" "$$BACKUP_BUCKET"; do
          mc mb --ignore-existing "local/$$bucket"
          mc encrypt set sse-s3 "local/$$bucket"
        done
        echo "Buckets listos con cifrado SSE-S3"
    networks: [internal]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sigo}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?defina ENCRYPTION_KEY}
      CORS_ORIGIN: ${PUBLIC_URL:?defina PUBLIC_URL}
      TRUST_PROXY: "1"
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:?defina SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:?defina MAIL_FROM}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET:-sigo-files}
      SEED_ON_START: "false"
      BOOTSTRAP_PRODUCTION: "true"
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?defina INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?defina INITIAL_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_IDLE_MINUTES: ${VITE_IDLE_MINUTES:-15}
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Gateway: único servicio publicado. TLS 1.3 con el certificado de ./certs.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal, public]

  # Respaldo diario cifrado de PostgreSQL + espejo de documentos (retención configurable).
  backup:
    build:
      context: ./backend
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sigo}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET:-sigo-files}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-sigo-backups}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
    networks: [internal]

networks:
  internal:
  public:

volumes:
  pgdata:
  redisdata:
  miniodata:
